# Nightly yedion scrape, run by a GitLab.com pipeline schedule. GitHub's runners (Microsoft Azure IPs) cannot
# reach the yedion; GitLab's shared runners (Google Cloud) can. The GitLab project holds no code: its
# .gitlab-ci.yml is just `include: remote:` with the raw URL of this file, so this repo stays the single source.
# Needs one masked GitLab CI variable, GH_PUSH_TOKEN: a GitHub fine-grained token, this repo only, Contents read/write.
# A push with that token triggers .github/workflows/deploy.yml. GitLab emails the owner when a run fails.
# The site allows about 400 requests per clock hour, a full run is ~1800 the first time: the scraper waits out the limit (--wait-throttle) and every answer is kept in
# .yedion-cache (next to the clone), which the pipeline cache carries to the next night (also after a failed run), so a first run may need a few nights (a run stopped by the 170 minute `timeout` ends green and commits nothing). Later nights: groups and exams only (~430).
scrape:
  image: node:24
  timeout: 3h
  cache:
    key: yedion-responses
    paths:
      - .yedion-cache/ # next to the clone, not inside it: a restored cache would make `git clone ... repo` fail on a non-empty directory
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ # api = run via the GitLab API or MCP
  variables:
    GIT_STRATEGY: none # nothing to check out on the GitLab side
  script:
    - git clone --depth 1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/dolhack/lets_learn.git" repo
    - cd repo && npm ci --no-audit --no-fund
    # stdout is one summary line (the commit message); a failed scrape writes nothing and fails the job.
    # The first runs are longer than the job (~1800 requests at 400 an hour): `timeout` stops the scraper before GitLab kills the job, the cache is saved, and the run counts as
    # partial (exit 0, nothing committed, no failure mail). Any other failure still fails the job.
    - |
      timeout 170m node scripts/scrape.mjs --all-semesters --all-programs --cache ../.yedion-cache --nightly --wait-throttle > ../summary.txt && rc=0 || rc=$?
      if [ "$rc" = 124 ]; then echo "partial run: the cache keeps what was fetched, the next run continues"; exit 0; fi
      [ "$rc" = 0 ] || exit "$rc"
    - git add web/data/afeka
    - if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
    - git -c user.name=dolhack -c user.email=64908772+dolhack@users.noreply.github.com commit -q -m "$(cat ../summary.txt)" -- web/data/afeka
    - git -c user.name=dolhack -c user.email=64908772+dolhack@users.noreply.github.com pull --rebase -q && git push # main may move during the scrape; only web/data/afeka changes here, so the rebase is clean
