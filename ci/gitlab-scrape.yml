# Nightly yedion scrape, run by a GitLab.com pipeline schedule. GitHub's runners (Microsoft Azure IPs) cannot
# reach the yedion; GitLab's shared runners (Google Cloud) can. The GitLab project holds no code: its
# .gitlab-ci.yml is just `include: remote:` with the raw URL of this file, so this repo stays the single source.
# Needs one masked GitLab CI variable, GH_PUSH_TOKEN: a GitHub fine-grained token, this repo only, Contents read/write.
# A push with that token triggers .github/workflows/deploy.yml. GitLab emails the owner when a run fails.
# The site allows about 400 requests per clock hour, a full run is ~1800 the first time: the scraper waits out the limit (--wait-throttle) and every answer is kept in
# .yedion-cache (next to the clone), which the pipeline cache carries to the next night (also after a failed run), so a first run may need a few nights (a run stopped by the 160 minute `timeout` ends green and commits nothing; the 4th such run in a row fails, so a stuck scrape sends the failure mail). Later nights: exams, half the courses' groups (each course every other night) and the weekly pages that expired (~250 requests, ~11 CI minutes; GitLab Free gives 400 a month, public projects too).
scrape:
  image: node:24
  timeout: 3h
  cache:
    key: yedion-responses
    paths:
      - .yedion-cache/ # next to the clone, not inside it: a restored cache would make `git clone ... repo` fail on a non-empty directory
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ # api = run via the GitLab API or MCP
  variables:
    GIT_STRATEGY: none # nothing to check out on the GitLab side
  script:
    - git clone --depth 1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/dolev-benezri/lets_learn.git" repo
    - cd repo && npm ci --no-audit --no-fund --ignore-scripts # no dependency needs an install script, and GH_PUSH_TOKEN is in the environment
    # stdout is one summary line (the commit message); a failed scrape writes nothing and fails the job.
    # The first runs are longer than the job (~1800 requests at 400 an hour): `timeout` stops the scraper before GitLab kills the job, the cache is saved, and the run counts as
    # partial (exit 0, nothing committed, no failure mail) up to 3 in a row; the counter lives in the cache. 160m leaves ~20 min of the 3h for clone, npm ci and the cache upload.
    # Any other failure still fails the job.
    - |
      timeout 160m node scripts/scrape.mjs --all-semesters --all-programs --cache ../.yedion-cache --nightly --wait-throttle > ../summary.txt && rc=0 || rc=$?
      if [ "$rc" = 124 ]; then
        n=$(( $(cat ../.yedion-cache/partial-runs 2>/dev/null || echo 0) + 1 )); echo "$n" > ../.yedion-cache/partial-runs
        echo "partial run $n in a row: the cache keeps what was fetched, the next run continues"
        if [ "$n" -lt 4 ]; then exit 0; fi
        echo "4 partial runs in a row: failing so the owner gets the mail"; exit 1
      fi
      [ "$rc" = 0 ] || exit "$rc"
      rm -f ../.yedion-cache/partial-runs
    - git add web/data/afeka
    - if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
    - git -c user.name=dolev-benezri -c user.email=64908772+dolev-benezri@users.noreply.github.com commit -q -m "$(cat ../summary.txt)" -- web/data/afeka
    - git -c user.name=dolev-benezri -c user.email=64908772+dolev-benezri@users.noreply.github.com pull --rebase -q && git push # main may move during the scrape; only web/data/afeka changes here, so the rebase is clean

# Two weeks' notice before GH_PUSH_TOKEN expires (README, "חידוש GH_PUSH_TOKEN"): a separate job, so a failure here only sends the mail and
# never stops a scrape or a data push. GitHub names a fine-grained token's expiry in a response header; a token without one passes. A GET, not HEAD: an edge answered HEAD with 404.
token-expiry:
  image: node:24
  stage: deploy # after the scrape, whatever its result
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
      when: always
  variables:
    GIT_STRATEGY: none
  script:
    - |
      hdr=$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${GH_PUSH_TOKEN}" https://api.github.com/rate_limit | tr -d '\r')
      code=$(printf '%s\n' "$hdr" | sed -n '1s/^HTTP[^ ]* \([0-9]*\).*/\1/p')
      if [ "$code" != 200 ]; then echo "GH_PUSH_TOKEN rejected or GitHub unreachable (HTTP ${code:-none}): README, 'חידוש GH_PUSH_TOKEN'"; exit 1; fi # an expired or revoked token answers 401 with no expiry header
      exp=$(printf '%s\n' "$hdr" | sed -n 's/^github-authentication-token-expiration: *//Ip')
      if [ -z "$exp" ]; then echo "GH_PUSH_TOKEN: no expiry date in the response"; exit 0; fi
      left=$(( ($(date -d "$exp" +%s) - $(date +%s)) / 86400 ))
      echo "GH_PUSH_TOKEN expires $exp ($left days)"
      if [ "$left" -lt 14 ]; then echo "renew GH_PUSH_TOKEN: README, 'חידוש GH_PUSH_TOKEN'"; exit 1; fi
