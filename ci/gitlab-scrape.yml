# GitLab is the standby. One schedule checks at 07:07 and 13:07 Israel time: `7 7,13 * * *`, timezone `Asia/Jerusalem`.
# A standby check costs about half a minute. When GitHub is not busy and its data is 12 hours old (or missing), restore the public cache seed,
# then publish the half split. A failed restore keeps GitLab's own cache, so a takeover may hold until its cache catches up.
# The GitLab project holds no code: its .gitlab-ci.yml includes this file remotely, so this repo stays the single source.
# Needs one masked GitLab CI variable, GH_PUSH_TOKEN: a GitHub fine-grained token whose resource owner is the lets-learn-il organization, this repo only, Contents read/write.
# A push with that token triggers .github/workflows/deploy.yml. GitLab emails the owner when a run fails.
# GH_PUSH_TOKEN stays for standby, so the token-expiry job below stays too.
# The site allows about 400 requests per clock hour; a cold full run is ~1650 base requests plus throttle waits and retries. GitHub reads all pages at night
# (~4 h) and groups and exams on a fresh afternoon (~405 base requests, ~1 h), about 2000-2100 a day. A late night may still be busy at 07:07; standby then waits.
# The scraper waits out the limit (--wait-throttle) and every answer is kept in
# .yedion-cache (next to the clone), which the pipeline cache carries to the next night (also after a failed run), so a first run may need a few nights (a run stopped by the 160 minute `timeout` ends green and commits nothing; the 4th such run in a row fails, so a stuck scrape sends the failure mail). Later nights: exams, half the courses' groups (each course every other night) and the weekly pages that expired (an estimate of 270-314 requests, 13-15 CI minutes; stale answers refreshed stop at 380 a night, so a normal run does not wait for the hourly limit; GitLab Free gives 400 a month, public projects too).
scrape:
  image: node:24
  timeout: 3h
  cache:
    key: yedion-responses
    paths:
      - .yedion-cache/ # next to the clone, not inside it: a restored cache would make `git clone ... repo` fail on a non-empty directory
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ # api = run via the GitLab API or MCP
  variables:
    GIT_STRATEGY: none # nothing to check out on the GitLab side
    STANDBY_HOURS: "12"
  script:
    - git clone --depth 1 "https://x-access-token:${GH_PUSH_TOKEN}@github.com/lets-learn-il/lets-learn-il.github.io.git" repo
    - cd repo
    - |
      if [ "$CI_PIPELINE_SOURCE" = schedule ]; then
        decision=$(node scripts/standby.mjs || true)
        echo "$decision"
        case "$decision" in standby:*) exit 0 ;; esac
      fi
    # Test beside the existing cache; replace only if every local year's published-at advances.
    - |
      seed=$(mktemp)
      seed_dir=$(mktemp -d)
      if curl -fsSL --max-time 120 https://github.com/lets-learn-il/lets-learn-il.github.io/releases/download/cache-seed/cache.tgz -o "$seed" &&
        tar -xzf "$seed" -C "$seed_dir" && [ -d "$seed_dir/.yedion-cache" ]; then
        if node scripts/standby.mjs --compare-seed "$seed_dir/.yedion-cache" ../.yedion-cache; then
          rm -rf ../.yedion-cache
          mv "$seed_dir/.yedion-cache" ../.yedion-cache
          echo "restored public cache seed"
        fi
      else
        echo "cache seed restore failed; keeping GitLab cache and continuing"
      fi
      rm -f "$seed"
      rm -rf "$seed_dir"
    - npm ci --omit=dev --no-audit --no-fund --ignore-scripts # dev packages (playwright, axe) are for the browser tests only; no dependency needs an install script, and GH_PUSH_TOKEN is in the environment
    # stdout is one summary line (the commit message); a failed scrape writes nothing and fails the job.
    # The first runs are longer than the job (~1650 base requests at ~400 an hour, plus throttle waits and retries): `timeout` stops the scraper before GitLab kills the job, the cache is saved, and the run counts as
    # partial (exit 0, nothing committed, no failure mail) up to 3 in a row; the counter lives in the cache. 160m leaves ~20 min of the 3h for clone, npm ci and the cache upload.
    # Any other failure still fails the job. SCRAPE_ARGS: empty at night; --force in a run by hand (docs/OPERATIONS.md, "ריצה שנעצרה בבדיקת נתונים").
    - |
      timeout 160m node scripts/scrape.mjs --all-semesters --all-programs --cache ../.yedion-cache --nightly --wait-throttle $SCRAPE_ARGS > ../summary.txt && rc=0 || rc=$?
      if [ "$rc" = 124 ]; then
        n=$(( $(cat ../.yedion-cache/partial-runs 2>/dev/null || echo 0) + 1 )); echo "$n" > ../.yedion-cache/partial-runs
        echo "partial run $n in a row: the cache keeps what was fetched, the next run continues"
        if [ "$n" -lt 4 ]; then exit 0; fi
        echo "4 partial runs in a row: failing so the owner gets the mail"; exit 1
      fi
      [ "$rc" = 0 ] || exit "$rc"
      rm -f ../.yedion-cache/partial-runs
    - git add web/data/afeka
    - if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
    - git -c user.name=dolev-benezri -c user.email=64908772+dolev-benezri@users.noreply.github.com commit -q -m "$(cat ../summary.txt)" -m "GitLab standby run" -- web/data/afeka
    - git -c user.name=dolev-benezri -c user.email=64908772+dolev-benezri@users.noreply.github.com pull --rebase -q && git push # main may move during the scrape; only web/data/afeka changes here, so the rebase is clean

# Two weeks' notice before GH_PUSH_TOKEN expires (docs/OPERATIONS.md, "חידוש GH_PUSH_TOKEN"): a separate job, so a failure here only sends the mail and
# never stops a scrape or a data push. GitHub names a fine-grained token's expiry in a response header; a token without one passes. A GET, not HEAD: an edge answered HEAD with 404.
token-expiry:
  image: node:24
  stage: deploy # after the scrape, whatever its result
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
      when: always
  variables:
    GIT_STRATEGY: none
  script:
    - |
      hdr=$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${GH_PUSH_TOKEN}" https://api.github.com/rate_limit | tr -d '\r')
      code=$(printf '%s\n' "$hdr" | sed -n '1s/^HTTP[^ ]* \([0-9]*\).*/\1/p')
      if [ "$code" != 200 ]; then echo "GH_PUSH_TOKEN rejected or GitHub unreachable (HTTP ${code:-none}): docs/OPERATIONS.md, 'חידוש GH_PUSH_TOKEN'"; exit 1; fi # an expired or revoked token answers 401 with no expiry header
      exp=$(printf '%s\n' "$hdr" | sed -n 's/^github-authentication-token-expiration: *//Ip')
      if [ -z "$exp" ]; then echo "GH_PUSH_TOKEN: no expiry date in the response"; exit 0; fi
      left=$(( ($(date -d "$exp" +%s) - $(date +%s)) / 86400 ))
      echo "GH_PUSH_TOKEN expires $exp ($left days)"
      if [ "$left" -lt 14 ]; then echo "renew GH_PUSH_TOKEN: docs/OPERATIONS.md, 'חידוש GH_PUSH_TOKEN'"; exit 1; fi
