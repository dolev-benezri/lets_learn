<h1>בדיקת PDF (דף זמני)</h1>
<p>נתונים בדויים. לחצו על כל כפתור לפי הסדר. כשקובץ נפתח או נשלח, בדקו שהוא באמת הגיע ושהעברית תקינה. בסוף צלמו את היומן.</p>
<button type="button" data-t="1">1. שיתוף, שם קובץ בעברית</button>
<button type="button" data-t="2">2. שיתוף, שם קובץ באנגלית</button>
<button type="button" data-t="3">3. שיתוף עם כותרת</button>
<button type="button" data-t="4">4. הורדה (blob)</button>
<button type="button" data-t="5">5. הורדה (data)</button>
<button type="button" data-t="6">6. פתיחה בכרטיסייה חדשה</button>
<button type="button" data-t="9">7. שיתוף, ואם נכשל מציע הורדה בלחיצה שנייה</button>
<button type="button" id="again" data-t="4" hidden>לחיצה שנייה: הורדה</button>
<a class="b" id="safari" href="#">8. פתיחת האתר בספארי</a>
<button type="button" data-t="7">9. פתיחה באותה כרטיסייה (אחרון, כי עוזב את הדף)</button>
