<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>המערכת שלי · אפקה</title>
<link rel="preload" href="fonts/rubik-hebrew-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="map.css">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#week" data-act="skip">דלג לתוכן הראשי</a>
<header class="top">
  <h1 id="title">המערכת שלי</h1>
  <p id="meta" class="meta"></p>
  <div id="switcher" class="switcher" role="group" aria-label="מעבר בין חלופות" tabindex="-1">
    <button type="button" id="prev" class="btn icon-btn" data-act="prev" data-icon="chevron-right" aria-label="החלופה הקודמת" aria-keyshortcuts="ArrowRight"></button>
    <span id="altLabel" class="alt-label">טוען…</span>
    <button type="button" id="next" class="btn icon-btn" data-act="next" data-icon="chevron-left" aria-label="החלופה הבאה" aria-keyshortcuts="ArrowLeft"></button>
  </div>
  <div class="actions">
    <button type="button" id="friendsBtn" class="btn avatars" data-act="panel" data-panel="friends" aria-haspopup="dialog"><span class="lbl">חברים</span></button>
    <button type="button" class="btn" data-act="panel" data-panel="prefs" data-icon="sliders" aria-haspopup="dialog"><span class="lbl">העדפות</span></button>
    <button type="button" class="btn" data-act="panel" data-panel="reg" data-icon="clipboard-list" aria-haspopup="dialog"><span class="lbl">רשימה להרשמה</span></button>
    <button type="button" class="btn primary" data-act="share" data-icon="share"><span class="lbl">שתף</span></button>
  </div>
</header>
<nav class="views" aria-label="מסכים"><a href="#me" data-view="me">המצב שלי</a><a href="#" data-view="plan">בניית מערכת</a></nav>
<div id="layout" class="layout">
  <main>
    <div id="banner"></div>
    <section id="board" class="board" aria-labelledby="weekTitle">
      <h2 id="weekTitle" class="sr" tabindex="-1">מערכת השעות</h2>
      <div id="semtabs" class="semtabs"></div>
      <div id="semnote"></div>
      <div class="board-top"><div id="pills" class="pills" tabindex="0" role="region" aria-label="סיכום החלופה"></div><span id="busy" class="busy" hidden>מחשב…</span></div>
      <div id="daysel" class="daysel" role="group" aria-label="בחירת יום"></div>
      <div id="week" tabindex="-1"></div>
      <p id="live" class="sr" aria-live="polite"></p>
    </section>
  </main>
  <aside id="side" aria-label="הקורסים שלי"></aside>
</div>
<main id="me" class="me" aria-labelledby="meTitle" hidden></main>
<div class="scrim" data-act="closeDrawer" aria-hidden="true"></div>
<footer class="site-foot">
  <p>כלי עזר לא רשמי, שאינו קשור למכללת אפקה. הנתונים נלקחים מהידיעון הציבורי ועלולים להיות שגויים או ישנים. ההרשמה באפקה-נט היא הקובעת.</p>
<p><a href="legal.html#terms">תנאי שימוש</a> · <a href="legal.html#privacy">פרטיות ועוגיות</a> · <a href="legal.html#accessibility">הצהרת נגישות</a> · <a
    href="https://github.com/dolhack/lets_learn/issues" target="_blank" rel="noopener">דיווח על טעות או בקשת הסרה</a></p>
</footer>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle"></dialog>
<dialog id="friendEd" class="dlg-full" aria-labelledby="feTitle"></dialog>
<div id="pop" class="pop" popover role="dialog"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="vendor/popover/popover.min.js" defer></script><!-- before the modules: the lesson popover on Safari 16 -->
<script type="module" src="ui-plan.js"></script>
</body>
</html>
