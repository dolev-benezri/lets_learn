<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>המערכת שלי · אפקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
<style>
/* Tokens: design-system/afeka-scheduler/pages/app.md (v2, light only).
   --success darkened from #12805C to #0B6E4F: the spec value is 4.41:1 on --success-soft. */
:root {
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#F1F3F9; --border:#E3E7EF; --border-strong:#CBD2DE;
  --text:#101828; --text-2:#475467; --text-3:#667085;
  --primary:#2563EB; --primary-hover:#1D4ED8; --primary-soft:#EAF1FE; --on-primary:#FFFFFF;
  --success:#0B6E4F; --success-soft:#E7F6EF; --warning:#B54708; --warning-soft:#FEF4E6; --danger:#C0262D; --danger-soft:#FDECEC;
  --friend:#F79009;
  --radius:12px; --radius-sm:8px; --shadow-pop:0 8px 24px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.06);
  --font:"Rubik", system-ui, "Segoe UI", Arial, sans-serif;
  --c0-bg:#EAF1FE; --c0-fg:#1D4ED8;  --c1-bg:#E7F6EF; --c1-fg:#0B6E4F;  --c2-bg:#F3EEFE; --c2-fg:#6D28D9;
  --c3-bg:#FDEEF4; --c3-fg:#BE185D;  --c4-bg:#FEF4E6; --c4-fg:#A15C07;  --c5-bg:#E6F6F8; --c5-fg:#0E7490;
  --c6-bg:#FDEEEB; --c6-fg:#C2410C;  --c7-bg:#EEF1F6; --c7-fg:#344054;
  --ppm:.8px; /* pixels per minute: 24px per 30-minute row */
}
.c0{--cbg:var(--c0-bg);--cfg:var(--c0-fg)} .c1{--cbg:var(--c1-bg);--cfg:var(--c1-fg)} .c2{--cbg:var(--c2-bg);--cfg:var(--c2-fg)} .c3{--cbg:var(--c3-bg);--cfg:var(--c3-fg)}
.c4{--cbg:var(--c4-bg);--cfg:var(--c4-fg)} .c5{--cbg:var(--c5-bg);--cfg:var(--c5-fg)} .c6{--cbg:var(--c6-bg);--cfg:var(--c6-fg)} .c7{--cbg:var(--c7-bg);--cfg:var(--c7-fg)}
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 var(--font); background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%; }
h1, h2, h3, p, ul, dl, dd { margin:0; }
ul { padding:0; list-style:none; }
button, input { font:inherit; color:inherit; }
a { color:var(--primary); }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
.sr { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.icon { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.grow { flex:1; min-width:0; }
.hint { color:var(--text-2); font-size:14px; }
.warn-text { color:var(--warning); display:inline-flex; align-items:center; gap:4px; }
.err-text { color:var(--danger); font-size:14px; display:flex; align-items:center; gap:6px; min-height:1.5em; margin-top:6px; }
.skip { position:absolute; inset-inline-start:16px; top:-100px; z-index:20; background:var(--primary); color:var(--on-primary); padding:10px 16px; border-radius:10px; }
.skip:focus { top:8px; }

/* buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text); font-weight:500; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color .15s ease, border-color .15s ease; }
.btn:hover { background:var(--surface-2); }
.btn.primary { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.btn.primary:hover { background:var(--primary-hover); }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.ghost:hover { background:var(--surface-2); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.icon-btn { width:44px; padding:0; }
.link-btn { min-height:44px; padding:0 8px; border:0; border-radius:8px; background:none; color:var(--primary); font-weight:500; cursor:pointer; transition:background-color .15s ease; }
.link-btn:hover { background:var(--primary-soft); }

/* top bar */
.top { display:grid; grid-template-columns:1fr auto 1fr; grid-template-areas:"title switch actions" "meta switch actions"; align-items:center; column-gap:16px;
  padding:10px 24px; background:var(--surface); border-bottom:1px solid var(--border); }
.top h1 { grid-area:title; font-size:18px; font-weight:600; }
.top h1 small { font-size:15px; font-weight:400; color:var(--text-2); }
.meta { grid-area:meta; font-size:13px; color:var(--text-3); }
.meta .icon { width:14px; height:14px; }
.switcher { grid-area:switch; display:flex; align-items:center; gap:2px; padding:3px; background:var(--surface-2); border-radius:999px; }
.switcher .btn { border:0; border-radius:999px; background:transparent; }
.switcher .btn:hover:not(:disabled) { background:var(--surface); }
.alt-label { min-width:132px; text-align:center; font-weight:500; font-variant-numeric:tabular-nums; }
.actions { grid-area:actions; display:flex; gap:8px; justify-content:flex-end; }
.avatars { padding:0 12px; }
.stack { display:flex; align-items:center; }
.av { display:inline-grid; place-items:center; width:24px; height:24px; flex:none; border-radius:50%; background:var(--surface); color:var(--text);
  font-size:12px; font-weight:500; line-height:1; box-shadow:0 0 0 2px var(--friend); }
.av.lg { width:36px; height:36px; font-size:14px; }
.stack .av { width:28px; height:28px; border:2px solid var(--surface); box-shadow:0 0 0 2px var(--friend); }
.stack .av + .av { margin-inline-start:-6px; }
.stack .av.plus { background:var(--primary-soft); color:var(--primary); box-shadow:none; }
.stack .av.plus .icon { width:14px; height:14px; }
.disclaimer { padding:6px 24px 0; font-size:13px; color:var(--text-3); }

/* layout: sidebar on the right (RTL), grid fills the rest */
.layout { display:grid; grid-template-columns:300px minmax(0, 1fr); gap:20px; padding:12px 24px 32px; align-items:start; }
main { min-width:0; }
aside { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; padding:2px; }

/* banners and status panel */
.banner { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:12px 16px; margin-bottom:16px; border-radius:var(--radius); background:var(--primary-soft); border:1px solid #C9DAFB; }
.banner.err { background:var(--danger-soft); border-color:#F6C7C9; color:var(--danger); }
.welcome { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
.welcome h2 { font-size:20px; font-weight:600; }
.welcome h2:focus { outline:none; }
.progress { margin:16px 0 8px; }
.progress-top { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
.bar { position:relative; height:8px; background:var(--surface-2); border-radius:999px; }
.bar i { display:block; height:100%; border-radius:999px; background:var(--primary); }
.bar .target { position:absolute; inset-inline-start:70%; top:-4px; bottom:-4px; width:2px; background:var(--text-2); }
.warnbox { display:flex; align-items:center; gap:8px; margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--danger-soft); color:var(--danger); }
.notice { display:flex; align-items:center; gap:8px; margin-top:8px; padding:10px 12px; border-radius:10px; background:var(--primary-soft); color:var(--text); }
.year h3 { margin:16px 0 8px; font-size:15px; font-weight:600; }
.year h3 span { font-weight:400; font-size:13px; color:var(--text-2); }
.chips { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px; margin-top:8px; }
.crs { padding:4px 10px 10px; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface); }
.crs[data-st="passed"] { background:var(--success-soft); border-color:#B7E4CF; }
.crs[data-st="failed"] { background:var(--danger-soft); border-color:#F6C7C9; }
.crs[data-st="exempt"] { display:flex; align-items:center; gap:8px; padding:10px; background:var(--surface-2); color:var(--text-2); }
.profile .field input { width:96px; min-height:44px; padding:0 10px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); }
.crs .seg legend { font-weight:500; }
.welcome details { margin-top:16px; }
.wel-foot { display:flex; justify-content:flex-end; margin-top:20px; }
details > summary { display:flex; align-items:center; gap:8px; min-height:44px; padding:0 4px; cursor:pointer; font-weight:500; border-radius:8px; list-style:none; }
details > summary::-webkit-details-marker { display:none; }
details > summary::after { content:""; width:8px; height:8px; margin-inline-start:auto; border:solid var(--text-2); border-width:0 2px 2px 0; transform:rotate(45deg); }
details[open] > summary::after { transform:rotate(-135deg); }

/* sidebar */
.side-head { display:flex; align-items:center; justify-content:space-between; }
.side-head h2 { font-size:17px; font-weight:600; }
aside > .hint { margin-bottom:10px; font-size:13px; }
.cards { display:grid; gap:8px; }
aside details { margin-top:8px; border-top:1px solid var(--border); padding-top:4px; }
aside details .cards { margin:4px 0 8px; }
.course { background:var(--surface); border:1px solid var(--border); border-inline-start:4px solid var(--border); border-radius:var(--radius); padding:6px 10px 8px; }
.course.rep { border-inline-start-style:dashed; } /* repeats a colour: only with more than 8 courses in one alternative */
.course.rep .dot { background:repeating-linear-gradient(45deg, var(--cfg) 0 2px, transparent 2px 4px); outline:1px solid var(--cfg); }
.blk.rep { border-inline-start-style:dashed; }
.course.in { border-inline-start-color:var(--cfg); background:linear-gradient(to left, var(--cbg), var(--surface) 55%); }
.course.out h3 { color:var(--text-2); }
.course-top { display:flex; align-items:center; gap:8px; }
.course h3 { flex:1; min-width:0; font-size:14px; font-weight:500; line-height:1.25; overflow-wrap:anywhere; }
.course .seg { margin:8px 0 0; }
.course .tags, .course .reason { margin-top:4px; }
.course .seg span { padding:0 6px; font-size:13px; }
@media (min-width:900px) { .course .seg span { min-height:28px; } }
@media (max-width:899px) { .course .seg label { min-width:44px; } }
.dot { width:10px; height:10px; flex:none; border-radius:50%; background:var(--cfg); }
.cr { font-size:12px; color:var(--text-2); white-space:nowrap; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-2); font-size:12px; font-weight:500; }
.tag .icon { width:13px; height:13px; }
.tag.ok { background:var(--success-soft); color:var(--success); }
.tag.warn { background:var(--warning-soft); color:var(--warning); }
.tag.bad { background:var(--danger-soft); color:var(--danger); }
.reason { margin-top:6px; font-size:13px; color:var(--text-2); }
.locked li { display:flex; gap:8px; padding:8px 4px; border-bottom:1px solid var(--border); font-size:14px; }
.locked li:last-child { border-bottom:0; }
.locked li > .icon { width:16px; height:16px; margin-top:3px; color:var(--text-2); }
.locked p { font-size:13px; color:var(--text-2); }

/* segmented control: native radios (arrow keys + radiogroup semantics for free) */
.seg { border:0; margin:10px 0 0; padding:0; min-width:0; }
.seg legend { padding:0; margin-bottom:4px; font-size:14px; }
.seg-opts { display:flex; background:var(--surface-2); border-radius:10px; }
.seg label { position:relative; flex:1; padding:3px; }
.seg input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
.seg span { display:flex; align-items:center; justify-content:center; min-height:38px; padding:0 4px; border-radius:8px; font-size:14px; color:var(--text-2); text-align:center; transition:background-color .15s ease; }
.seg label:hover span { background:rgba(255,255,255,.6); }
.seg input:checked + span { background:var(--surface); color:var(--text); font-weight:500; box-shadow:0 1px 2px rgba(16,24,40,.1); }
.seg input[value="must"]:checked + span { background:var(--primary-soft); color:var(--primary-hover); }
.seg input:focus-visible + span { outline:2px solid var(--primary); outline-offset:1px; }

/* board: pills + week grid */
.board { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; overflow:hidden; }
.board.is-busy::before { content:""; position:absolute; top:0; inset-inline:0; height:3px; background:linear-gradient(90deg, transparent, var(--primary), transparent) no-repeat; background-size:40% 100%; animation:slide 1.1s linear infinite; }
@keyframes slide { from { background-position:-60% 0; } to { background-position:160% 0; } }
.board-top { display:flex; align-items:flex-start; gap:8px; margin-bottom:12px; min-height:34px; }
.pills { display:flex; flex-wrap:wrap; gap:8px; flex:1; }
.pill-info { flex-basis:100%; margin:0; font-size:13px; color:var(--text-2); }
.pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; background:var(--surface-2); color:var(--text); font-size:14px; }
.pill .icon { width:16px; height:16px; color:var(--text-2); }
.pill.friend { background:var(--warning-soft); color:var(--warning); }
.pill.friend .icon { color:var(--warning); }
.pill.quiet { background:none; color:var(--text-2); }
.busy { display:inline-flex; align-items:center; gap:6px; padding:5px 4px; font-size:14px; color:var(--text-2); white-space:nowrap; }
.busy[hidden] { display:none; }
.busy::before { content:""; width:14px; height:14px; border-radius:50%; border:2px solid var(--border-strong); border-top-color:var(--primary); animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#week:focus { outline:none; }
#week:focus-visible { outline:2px solid var(--primary); outline-offset:4px; border-radius:8px; }
.msg { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; margin-bottom:12px; border-radius:var(--radius); background:var(--primary-soft); }
.msg > .icon { width:22px; height:22px; color:var(--primary); margin-top:1px; }
.msg.bad { background:var(--danger-soft); }
.msg.bad > .icon, .msg.bad b { color:var(--danger); }
.msg ul { list-style:disc; padding-inline-start:18px; margin-top:4px; }
.msg-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.daysel { display:none; gap:6px; margin-bottom:12px; }
.daysel button { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:48px; border:1px solid var(--border); border-radius:10px; background:var(--surface); font-weight:500; cursor:pointer; line-height:1.2; }
.daysel button[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.daysel .free { font-size:12px; font-weight:400; }

.wk { display:grid; grid-template-columns:52px repeat(var(--cols), minmax(0, 1fr)); }
.wk-head { display:contents; }
.dh { padding:0 4px 10px; text-align:center; font-size:13px; color:var(--text-2); line-height:1.25; }
.dh b { display:block; font-size:16px; font-weight:600; color:var(--text); }
.hours { position:relative; height:calc(var(--span) * var(--ppm)); }
.hours span { position:absolute; top:calc(var(--s) * var(--ppm) + 3px); inset-inline-end:8px; line-height:1; font-size:12px; color:var(--text-3); font-variant-numeric:tabular-nums; }
.day { position:relative; height:calc(var(--span) * var(--ppm)); border-inline-start:1px solid var(--border); border-top:1px solid var(--border); border-bottom:1px solid var(--border);
  background:repeating-linear-gradient(to bottom, transparent 0 calc(60 * var(--ppm) - 1px), var(--border) calc(60 * var(--ppm) - 1px) calc(60 * var(--ppm))),
             repeating-linear-gradient(to bottom, var(--surface) 0 calc(60 * var(--ppm)), #FAFBFD calc(60 * var(--ppm)) calc(120 * var(--ppm))); }
.day:last-child { border-inline-end:1px solid var(--border); }
.blk { position:absolute; inset-inline:3px; top:calc(var(--s) * var(--ppm) + 1px); height:calc(var(--d) * var(--ppm) - 2px); display:flex; flex-direction:column; align-items:stretch; gap:1px;
  padding:4px 8px; border:0; border-inline-start:3px solid var(--cfg); border-radius:8px; background:var(--cbg); color:var(--text); font-size:13px; line-height:1.3;
  text-align:start; overflow:hidden; cursor:pointer; transition:background-color .15s ease; }
/* hover keeps the background, so the course fg stays at its measured contrast */
.blk:hover { box-shadow:inset 0 0 0 1px var(--cfg); }
.blk > span { overflow:hidden; text-overflow:ellipsis; }
.blk-name { font-weight:500; color:var(--cfg); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; white-space:normal; }
.blk-meta, .blk-room { font-size:12px; color:var(--text-2); }
.blk-meta { white-space:nowrap; }
.blk.short .blk-room { display:none; }
.blk.short .blk-name { -webkit-line-clamp:1; }
.blk.pinned { outline:2px solid var(--primary); outline-offset:-2px; padding-inline-end:24px; }
.blk:focus-visible { outline:2px solid var(--primary); outline-offset:2px; z-index:1; }
.blk-pin { position:absolute; top:4px; inset-inline-end:4px; color:var(--primary); }
.blk-pin .icon { width:14px; height:14px; }
.blk-fr { position:absolute; bottom:4px; inset-inline-end:5px; display:flex; }
.blk-fr .av { width:22px; height:22px; }
.blk-fr .av + .av { margin-inline-start:-4px; }

/* popover (block details) */
.pop { inset:auto; margin:0; width:340px; max-width:calc(100vw - 16px); padding:12px 14px; border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-pop); }
.pop-head { display:flex; align-items:flex-start; gap:10px; }
.pop-head .dot { margin-top:8px; }
.pop-head > div { flex:1; min-width:0; }
.pop-head h3 { font-size:17px; font-weight:600; color:var(--cfg); }
.pop-head p { font-size:13px; color:var(--text-2); }
.pop-head .btn { margin:-8px -8px 0 0; }
.pop dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0 0 8px; font-size:14px; }
.pop dt { color:var(--text-2); }
.pop dd .av { width:20px; height:20px; font-size:12px; }
.pop .tag { margin-bottom:10px; }
.pop-actions { display:flex; flex-wrap:wrap; gap:8px; }
.pop-hint { margin:0 0 4px; font-size:13px; color:var(--text-2); }
.pop-alt-h { margin:10px 0 6px; font-size:14px; font-weight:600; }
.pop-alts { display:grid; gap:4px; font-size:13px; }
.pop-alts li { padding:6px 8px; border-radius:8px; }
.pop-alts li.cur { background:var(--surface-2); }
.pop-alts li.na { opacity:.65; }
.pop-alts .btn { width:100%; min-height:44px; justify-content:flex-start; text-align:start; flex-wrap:wrap; font-size:13px; }
.pop-alts .tag { margin:0; }

/* drawer (preferences / friends / registration) */
.drawer { position:fixed; inset-block:0; inset-inline-end:0; inset-inline-start:auto; width:min(var(--drawer-w, 440px), 100vw); height:100dvh; max-height:none; max-width:none; margin:0; padding:0;
  border:0; border-start-start-radius:16px; border-end-start-radius:16px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-pop); overflow:auto; }
/* non-modal: the grid stays visible and live; on wide screens the page makes room for the drawer */
.drawer { z-index:20; }
@media (min-width:900px) { body.drawer-open { padding-inline-end:var(--drawer-w, 440px); } } /* docked: the top bar and the grid shrink instead of sliding under it */
.dr-top { position:sticky; top:0; z-index:1; background:var(--surface); border-bottom:1px solid var(--border); }
.dr-head { display:flex; align-items:center; justify-content:space-between; padding:12px 12px 12px 20px; padding-inline-start:20px; }
.dr-head h2 { font-size:18px; font-weight:600; }
.dr-body { display:grid; gap:24px; padding:16px 20px 28px; }
.dr-sec h3 { margin-bottom:6px; font-size:15px; font-weight:600; }
.dr-sec .seg:first-of-type { margin-top:4px; }
.dr-foot { padding-top:16px; border-top:1px solid var(--border); }
.daypills { display:flex; flex-wrap:wrap; gap:8px; }
.daypill { width:44px; height:44px; border:1px solid var(--border-strong); border-radius:50%; background:var(--surface); font-weight:500; cursor:pointer; transition:background-color .15s ease; }
.daypill:hover { background:var(--surface-2); }
.daypill[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.times { display:flex; flex-wrap:wrap; gap:8px 16px; }
.field { display:flex; align-items:center; gap:8px; min-height:44px; }
.field.col { flex-direction:column; align-items:stretch; gap:4px; margin-bottom:8px; }
.drawer input[type=time], .drawer input[type=number], .drawer input[type=text] { min-height:44px; padding:0 10px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); }
.drawer input[type=number] { width:96px; }
.check { display:flex; align-items:center; gap:10px; min-height:44px; cursor:pointer; }
.check input { width:20px; height:20px; margin:0; accent-color:var(--primary); }
.row { display:flex; gap:8px; }
.row input { flex:1; min-width:0; }
.frow { display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; padding:12px; margin-bottom:8px; border:1px solid var(--border); border-radius:var(--radius); }
.frow-full { flex-basis:100%; }
#semnote .notice { margin:0 0 12px; }
.semtabs .seg { margin:0 0 12px; max-width:320px; }
.course > .seg { margin-top:6px; }
.reg-sem { margin:12px 0 0; font-size:15px; font-weight:600; }
.reglist { display:grid; gap:8px; margin:12px 0; }
.reglist li { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-inline-start:4px solid var(--cfg); border-radius:var(--radius); }
.reglist p { font-size:14px; color:var(--text-2); }
.plain li { padding:4px 0; font-size:14px; }

.toast { position:fixed; bottom:20px; inset-inline:0; margin:auto; width:max-content; max-width:calc(100vw - 32px); padding:10px 16px; border-radius:10px;
  background:var(--text); color:var(--surface); box-shadow:var(--shadow-pop); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:30; }
.toast.show { opacity:1; }

/* sticky top bar on desktop */
@media (min-width:900px) {
  .top { position:sticky; top:0; z-index:5; }
  aside { top:84px; max-height:calc(100vh - 96px); }
}
/* tablet + mobile: grid first, sidebar below */
@media (max-width:899px) {
  .top { grid-template-columns:1fr auto; grid-template-areas:"title actions" "meta meta" "switch switch"; row-gap:6px; padding:8px 16px; }
  .switcher { justify-self:stretch; justify-content:space-between; }
  .actions { gap:4px; }
  .actions .lbl { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .actions .btn:not(.avatars) { width:44px; padding:0; }
  .disclaimer { padding:6px 16px 0; }
  .layout { grid-template-columns:minmax(0, 1fr); padding:12px 16px 24px; gap:16px; }
  main { order:-1; }
  aside { position:static; max-height:none; overflow:visible; }
}
/* phone: one day at a time, popover as bottom sheet, drawer as bottom sheet */
/* below 760px a 5-day week gets too narrow to read: one day at a time with a day selector */
@media (max-width:759px) {
  :root { --ppm:.9px; }
  .daysel { display:flex; }
  .wk { grid-template-columns:48px minmax(0, 1fr); }
  .wk-head, .day:not(.on) { display:none; }
  .day.on { border-inline-end:1px solid var(--border); }
}
@media (max-width:599px) {
  .top h1 small { display:none; }
  .board { padding:12px; }
  .welcome { padding:16px; }
  .pop.pop { position:fixed; inset:auto 0 0 0 !important; width:100%; max-width:none; border-radius:16px 16px 0 0; max-height:80dvh; overflow:auto; }
  .drawer { inset-block-start:auto; inset-inline:0; width:100vw; height:auto; max-height:75dvh; border-radius:16px 16px 0 0; box-shadow:0 -8px 24px rgba(16,24,40,.16); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { transition:none !important; animation:none !important; }
}
.notice.partial { flex-wrap:wrap; margin-top:0; margin-bottom:12px; }
.notice.partial span { flex:1 1 16rem; }
.notice.partial .btn { margin-inline-start:auto; }

/* batch 5: sidebar, drawers, popover */
:root { --drawer-w:clamp(340px, 30vw, 440px); }
/* course card: title row, then the selector on its own full-width row; the semester picker is labelled */
.sem-row { display:flex; align-items:center; gap:8px; margin-top:6px; }
.sem-row .seg { flex:1; margin:0; }
.sem-lbl { flex:none; font-size:13px; color:var(--text-2); }
/* drawer */
.dr-actions { padding:0 20px 12px; display:flex; gap:8px; }
.dr-actions .btn { flex:1; }
.dr-sec .hint { margin-top:6px; }
.drawer.modal::backdrop, .dlg::backdrop { background:rgba(16,24,40,.45); }
body:has(.drawer.modal[open]), body.pop-open { overflow:hidden; }
/* popover: <= ~360px tall; header and actions stay put, details scroll inside */
.pop:popover-open { display:flex; flex-direction:column; gap:8px; max-height:min(360px, calc(100dvh - 16px)); overflow:hidden; }
.pop-body { min-height:0; overflow:auto; overscroll-behavior:contain; }
.pop-body > .tag { margin-bottom:8px; }
.pop .gid, .pop-alts .gid { color:var(--text-2); font-size:12px; }
.pop-actions .btn { min-height:44px; }
@media (max-width:599px) {
  .pop.pop:popover-open { max-height:min(75dvh, 460px); overflow:hidden; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  .pop::backdrop { background:rgba(16,24,40,.45); }
}
/* in-page dialog (replaces confirm / prompt) */
.dlg { width:min(420px, calc(100vw - 32px)); padding:20px; border:1px solid var(--border); border-radius:16px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-pop); }
.dlg p { margin:0 0 16px; font-size:16px; }
.dlg h2 { margin:0 0 12px; font-size:17px; font-weight:600; }
.dlg textarea { display:block; width:100%; margin-bottom:16px; padding:10px; border:1px solid var(--border-strong); border-radius:10px; font:inherit; font-size:14px; }
.dlg-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
/* the toast lives in the top layer (popover="manual") so it shows above a modal drawer */
.toast[popover] { top:auto; border:0; overflow:visible; }
</style>
</head>
<body>
<a class="skip" href="#week">דלג למערכת השעות</a>
<header class="top">
  <h1 id="title">המערכת שלי</h1>
  <p id="meta" class="meta"></p>
  <div id="switcher" class="switcher" role="group" aria-label="מעבר בין חלופות" tabindex="-1">
    <button type="button" id="prev" class="btn icon-btn" data-act="prev" data-icon="chevron-right" aria-label="החלופה הקודמת" aria-keyshortcuts="ArrowRight"></button>
    <span id="altLabel" class="alt-label">טוען…</span>
    <button type="button" id="next" class="btn icon-btn" data-act="next" data-icon="chevron-left" aria-label="החלופה הבאה" aria-keyshortcuts="ArrowLeft"></button>
  </div>
  <div class="actions">
    <button type="button" id="friendsBtn" class="btn avatars" data-act="panel" data-panel="friends" aria-haspopup="dialog"><span class="lbl">חברים</span></button>
    <button type="button" class="btn" data-act="panel" data-panel="prefs" data-icon="sliders" aria-haspopup="dialog"><span class="lbl">העדפות</span></button>
    <button type="button" class="btn" data-act="panel" data-panel="reg" data-icon="clipboard-list" aria-haspopup="dialog"><span class="lbl">רשימה להרשמה</span></button>
    <button type="button" class="btn primary" data-act="share" data-icon="share"><span class="lbl">שתף</span></button>
  </div>
</header>
<p class="disclaimer">כלי עזר לא רשמי, בלי שום אחריות. הנתונים עלולים להיות שגויים, וההרשמה באפקה-נט היא הקובעת. <a href="https://github.com/dolhack/lets_learn/blob/main/TERMS.md" target="_blank" rel="noopener">תנאי שימוש</a></p>
<div class="layout">
  <aside id="side" aria-label="הקורסים שלי"></aside>
  <main>
    <div id="banner"></div>
    <section id="welcome" class="welcome" aria-labelledby="welTitle" hidden></section>
    <section id="board" class="board" aria-labelledby="weekTitle">
      <h2 id="weekTitle" class="sr">מערכת השעות</h2>
      <div id="semnote"></div>
      <div class="board-top"><div id="pills" class="pills"></div><span id="busy" class="busy" hidden>מחשב…</span></div>
      <div id="semtabs" class="semtabs"></div>
      <div id="daysel" class="daysel" role="group" aria-label="בחירת יום"></div>
      <div id="week" tabindex="-1"></div>
      <p id="live" class="sr" aria-live="polite"></p>
    </section>
  </main>
</div>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle"></dialog>
<div id="pop" class="pop" popover role="dialog"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="ui-plan.js"></script>
</body>
</html>
