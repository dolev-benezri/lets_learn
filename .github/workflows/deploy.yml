# Deploy web/ to GitHub Pages. The data is refreshed nightly by ci/gitlab-scrape.yml on GitLab CI,
# which pushes web/data/afeka to main (that push triggers this workflow). A change to the tests or scripts runs it too, so a break shows at once.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'test/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/**']

permissions:
  contents: read

# One deploy at a time. A queued run waits; a running deploy is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A broken build never reaches the site: the deploy needs the whole suite green (the nightly data push runs it too).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
