# Deploy web/ to GitHub Pages. The data is refreshed nightly by ci/gitlab-scrape.yml on GitLab CI,
# which pushes web/data/afeka to main (that push triggers this workflow).
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**']

permissions:
  contents: read

# One deploy at a time. A queued run waits; a running deploy is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A broken build never reaches the site: the deploy needs the whole suite green (the nightly data push runs it too).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
