# Checks that mail the owner when they fail and never stop a deploy. check:real reads the real data, and a night's data must not hold the site back.
name: checks

on:
  workflow_dispatch:
    inputs:
      base:
        description: Compare prerequisites with the main tip before the data commit
        type: string
        required: false
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/checks.yml']

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Use the push's old tip or the publisher's rebased parent, so a concurrent code push is included correctly. Empty on an ordinary run by hand.
      - if: github.event.before || inputs.base
        run: git fetch -q --depth=1 origin "$BEFORE" || true # gone after a history rewrite: then there is nothing to compare
        env:
          BEFORE: ${{ github.event.before || inputs.base }}
      - run: npm run check:real
        env:
          CHECK_BASE: ${{ github.event.before || inputs.base }}
      - run: npm run check:export -- web/data/afeka

  # Only names that do not exist. The other type errors in untyped web/*.js are noise (DOM narrowing, default parameters).
  undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: |
          npx -y -p typescript@5.9.3 tsc --noEmit --allowJs --checkJs --target es2022 --module esnext --moduleResolution bundler \
            --lib es2023,dom,dom.iterable --skipLibCheck web/*.js > tsc.txt || true
          ! grep -E 'TS2304|TS2552' tsc.txt
