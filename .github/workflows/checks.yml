# Checks that mail the owner when they fail and never stop a deploy. check:real reads the real data, and a night's data must not hold the site back.
name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/checks.yml']

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # What the prerequisites changed from: the commit the push came from, not the one before, or a push of several commits hides a change. Empty on a run by hand.
      - if: github.event_name == 'push'
        run: git fetch -q --depth=1 origin "$BEFORE" || true # gone after a history rewrite: then there is nothing to compare
        env:
          BEFORE: ${{ github.event.before }}
      - run: npm run check:real
        env:
          CHECK_BASE: ${{ github.event.before }}
      - run: npm run check:export -- web/data/afeka

  # Only names that do not exist. The other type errors in untyped web/*.js are noise (DOM narrowing, default parameters).
  undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npx -y -p typescript@5.9.3 tsc --noEmit --allowJs --checkJs --target es2022 --module esnext --moduleResolution bundler \
            --lib es2023,dom,dom.iterable --skipLibCheck web/*.js > tsc.txt || true
          ! grep -E 'TS2304|TS2552' tsc.txt
