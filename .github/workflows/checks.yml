# Checks that mail the owner when they fail and never stop a deploy. check:real reads the real data, and a night's data must not hold the site back.
name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/checks.yml']

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the commit before this one: what the prerequisites changed from
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check:real
        env:
          CHECK_BASE: HEAD~1
      - run: npm run check:export -- web/data/afeka

  # Only names that do not exist. The other type errors in untyped web/*.js are noise (DOM narrowing, default parameters).
  undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npx -y -p typescript@5.9.3 tsc --noEmit --allowJs --checkJs --target es2022 --module esnext --moduleResolution bundler \
            --lib es2023,dom,dom.iterable --skipLibCheck web/*.js > tsc.txt || true
          ! grep -E 'TS2304|TS2552' tsc.txt
