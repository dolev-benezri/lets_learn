# Refresh the yedion data and deploy web/ to GitHub Pages.
# Run it by hand from the Actions tab (Run workflow). The nightly schedule below starts disabled.
name: refresh-deploy

on:
  workflow_dispatch:
  # Enable the schedule after about a week of successful manual runs: remove the leading "# " from the
  # four lines below. Slots avoid 02:00-03:00 (Israel DST changes). The second slot is a retry in case the
  # first one was dropped or failed; the skip guard below makes it a no-op when the first one worked.
  # schedule:
  #   - cron: '17 0 * * *'
  #     timezone: 'Asia/Jerusalem'
  #   - cron: '47 3 * * *'
  #     timezone: 'Asia/Jerusalem'

permissions:
  contents: read

# One run at a time. A queued run waits; a running scrape is never cancelled halfway.
concurrency:
  group: refresh-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # commit the data
      issues: write   # failure issue
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Scheduled scrape failing
    steps:
      - uses: actions/checkout@v7

      # Scheduled runs only (a manual run is always meant). Skip when the last check is under 12 h old
      # (the retry slot after a good first slot), or when GitHub delayed the run past 07:00 in Israel.
      - name: Skip guard
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = schedule ]; then
            hour=$(TZ=Asia/Jerusalem date +%H)
            checked=$(jq -r '.checkedAt // empty' web/data/afeka/status.json 2>/dev/null || true)
            if [ $((10#$hour)) -ge 7 ]; then
              skip=true; echo "::notice::Skipping: it is $hour:xx in Israel (after 07:00)"
            elif [ -n "$checked" ] && [ $(( $(date +%s) - $(date -d "$checked" +%s) )) -lt 43200 ]; then
              skip=true; echo "::notice::Skipping: last check was $checked (under 12 h ago)"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # a job that can push gets no restored cache
      - if: steps.guard.outputs.skip != 'true'
        run: npm ci

      # stdout is exactly one summary line (the commit message); progress on stderr goes to the log and the file.
      - name: Scrape
        id: scrape
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/scrape.mjs --all-semesters 2>&1 >"$RUNNER_TEMP/summary.txt" | tee "$RUNNER_TEMP/scrape.log"
          echo "summary=$(cat "$RUNNER_TEMP/summary.txt")" >> "$GITHUB_OUTPUT"

      # Changed data and status.json go in one commit. When only status.json changed (the usual night), the
      # summary line says "no changes" and the commit still keeps the repo active (GitHub pauses the
      # schedule after 60 days without repo activity).
      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        env:
          SUMMARY: ${{ steps.scrape.outputs.summary }}
        run: |
          git add web/data/afeka
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$SUMMARY"
          git pull --rebase
          git push

      - name: Close the failure issue
        if: steps.guard.outputs.skip != 'true'
        run: |
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          [ -z "$n" ] || gh issue close "$n" --comment "Back to normal: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-failure-log
          path: ${{ runner.temp }}/scrape.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Open or update the failure issue
        if: failure()
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Run failed ($GITHUB_EVENT_NAME): $run_url"
            echo
            echo 'Last log lines (the full log is the scrape-failure-log artifact of that run):'
            echo '```'
            tail -n 30 "$RUNNER_TEMP/scrape.log" 2>/dev/null || echo '(no scrape log; it failed before or after the scrape step)'
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue comment "$n" --body-file "$RUNNER_TEMP/issue.md"
          fi

  # A push made with GITHUB_TOKEN does not trigger on: push, so the deploy is a job here, not a separate workflow.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.skip != 'true' # runs also when the data did not change
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch tip, not the triggering SHA: the scrape job may have pushed a newer commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
