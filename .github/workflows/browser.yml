# The real-browser checks (WebKit, the engine of iPhone Safari): flows, tour and accessibility. They mail the owner when they fail and never stop a deploy.
# Not on the nightly data push: they read the frozen copy, so a night changes nothing they check.
name: browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '!web/data/**', 'test/browser/**', 'test/fixtures/real/**', 'package-lock.json', '.github/workflows/browser.yml']

permissions:
  contents: read

concurrency:
  group: browser
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - run: npm run test:browser
