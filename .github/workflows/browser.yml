# The real-browser checks in three engines (WebKit is the engine of iPhone Safari; Chromium covers Android and desktop Chrome): flows, tour and accessibility. They mail the owner
# when they fail and never stop a deploy.
# Not on the nightly data push: they read the frozen copy, so a night changes nothing they check.
name: browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '!web/data/**', 'test/browser/**', 'test/fixtures/real/**', 'package-lock.json', '.github/workflows/browser.yml']

permissions:
  contents: read

concurrency:
  group: browser
  cancel-in-progress: true

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium, firefox]
        # 4 jobs per engine, one spec file at a time in each (CI): one runner with three browsers at once failed tests at random
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 35 # a shard; the whole WebKit run took 19-20 min with 696 tests three files at a time (11-24), and the 20 cut it off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}/4
